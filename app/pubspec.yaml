name: due
description: What a household has committed to pay this month, and what still needs you.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  due_kit:
    path: ../packages/due_kit
  intl: any
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  go_router: ^18.1.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
